<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e24; padding: 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #141419; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ff0050; color: #fff; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; display: none; }
        video { width: 100%; border-radius: 8px; margin-top: 10px; }
        a { display: block; margin-top: 10px; color: #00f2fe; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>틱톡 영상 다운로더</h2>
        <input type="text" id="urlInput" placeholder="틱톡 링크를 입력하세요">
        <button onclick="fetchVideo()">추출하기</button>
        <div id="result">
            <p id="title"></p>
            <video id="player" controls></video>
            <a id="downloadLink" target="_blank">영상 저장하기</a>
        </div>
    </div>
    <script>
        async function fetchVideo() {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert('링크를 넣어주세요!');
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('title').innerText = data.title;
                document.getElementById('player').src = data.videoUrl;
                document.getElementById('downloadLink').href = data.videoUrl;
                document.getElementById('result').style.display = 'block';
            } else { alert(data.error); }
        }
    </script>
</body>
</html>
