<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background: #0f0f12; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: #18181c; border-radius: 24px; padding: 32px 24px; border: 1px solid #2a2a30; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .header { text-align: center; margin-bottom: 28px; }
    .header i { font-size: 40px; color: #ff0050; margin-bottom: 12px; }
    .header h1 { font-size: 22px; font-weight: 700; }
    .input-group { display: flex; gap: 8px; margin-bottom: 24px; background: #222228; padding: 6px; border-radius: 16px; border: 1px solid #33333d; }
    input { flex: 1; background: transparent; border: none; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; }
    button { background: linear-gradient(45deg, #ff0050, #00f2fe); border: none; padding: 12px 20px; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; transform: scale(0.98); }
    
    .card { display: none; background: #222228; border-radius: 16px; overflow: hidden; border: 1px solid #33333d; }
    .card-img { width: 100%; height: 240px; object-fit: cover; }
    .card-body { padding: 16px; }
    .author { font-size: 13px; color: #a0a0ab; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .stats { display: flex; gap: 16px; font-size: 13px; color: #80808a; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #2d2d35; }
    .stats div { display: flex; align-items: center; gap: 6px; }
    .download-btn { display: block; width: 100%; text-align: center; background: #ff0050; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 600; }
    
    .loading { display: none; text-align: center; padding: 20px; color: #80808a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <i class="fa-brands fa-tiktok"></i>
      <h1>TikTok Video Downloader</h1>
    </div>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="틱톡 영상 링크를 붙여넣으세요">
      <button onclick="fetchVideo()">추출</button>
    </div>

    <div class="loading" id="loading"><i class="fa-solid fa-spinner fa-spin"></i> 영상을 불러오는 중...</div>

    <div class="card" id="resultCard">
      <img id="cover" class="card-img" src="" alt="Thumbnail">
      <div class="card-body">
        <div class="author"><i class="fa-solid fa-user"></i> <span id="author"></span></div>
        <div class="title" id="title"></div>
        <div class="stats">
          <div><i class="fa-solid fa-play"></i> <span id="views">0</span></div>
          <div><i class="fa-solid fa-heart"></i> <span id="likes">0</span></div>
        </div>
        <a id="downloadLink" class="download-btn" href="" target="_blank" rel="noreferrer"><i class="fa-solid fa-download"></i> 워터마크 없이 다운로드</a>
      </div>
    </div>
  </div>

  <script>
    async function fetchVideo() {
      const urlInput = document.getElementById('urlInput');
      const url = urlInput.value.trim();
      if(!url) return alert('링크를 입력하세요!');

      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        const res = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        
        if (data.success) {
          document.getElementById('cover').src = data.cover || '';
          document.getElementById('author').innerText = data.author || 'TikTok User';
          document.getElementById('title').innerText = data.title || 'TikTok Video';
          document.getElementById('views').innerText = data.views ? Number(data.views).toLocaleString() : '0';
          document.getElementById('likes').innerText = data.likes ? Number(data.likes).toLocaleString() : '0';
          document.getElementById('downloadLink').href = data.videoUrl;
          
          resultCard.style.display = 'block';
        } else {
          alert(data.error || '영상을 가져올 수 없습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 응답 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
